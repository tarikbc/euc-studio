name: ci-engine

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/**"
      - "profiles/**"
      - "tools/fetch-mujoco/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - "deny.toml"
      - ".github/workflows/ci-engine.yml"

permissions:
  contents: read

concurrency:
  group: ci-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml, with rustfmt and clippy.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The MuJoCo library euc-physics links: the official release, checked against its pinned sha256.
      - name: Fetch MuJoCo
        run: python tools/fetch-mujoco/fetch.py --github
      - run: python -m unittest discover -s tools/fetch-mujoco -p 'test_*.py'
      - run: cargo fmt --all --check
      # All features: the Unicorn backend (GPL-2.0, dev only) is linted too.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The MuJoCo library euc-physics links: the official release, checked against its pinned sha256.
      - name: Fetch MuJoCo
        run: python tools/fetch-mujoco/fetch.py --github
      # euc-unicorn builds QEMU and boots the stock image; stock-boot.yml runs it.
      - run: cargo test --workspace --exclude euc-unicorn --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Licenses, advisories, bans and sources, per deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
