name: ci-engine

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/**"
      - "profiles/**"
      # The SIL library's C ABI and board side, which the SIL tests load.
      - "firmware/ports/sim/**"
      - "tools/fetch-mujoco/**"
      - "tools/ride-log/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - "deny.toml"
      - ".github/workflows/ci-engine.yml"

permissions:
  contents: read

concurrency:
  group: ci-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml, with rustfmt and clippy.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The MuJoCo library euc-physics links: the official release, checked against its pinned sha256.
      - name: Fetch MuJoCo
        run: python tools/fetch-mujoco/fetch.py --github
      - run: python -m unittest discover -s tools/fetch-mujoco -p 'test_*.py'
      - run: python -m unittest discover -s tools/ride-log -p 'test_*.py'
      - run: cargo fmt --all --check
      # All features: the Unicorn backend (GPL-2.0, dev only) is linted too.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The MuJoCo library euc-physics links: the official release, checked against its pinned sha256.
      - name: Fetch MuJoCo
        run: python tools/fetch-mujoco/fetch.py --github
      # euc-unicorn builds QEMU and boots the stock image; stock-boot.yml runs it.
      - run: cargo test --workspace --exclude euc-unicorn --locked
      # The SIL library (firmware/ports/sim, docs/sil.md) for the tests that load it, which are ignored
      # without it. This links it with -alias on macOS and --defsym on Linux. Windows cannot run it yet
      # (euc_sim::sil::UNSUPPORTED).
      - name: Build the SIL library
        if: runner.os != 'Windows'
        working-directory: firmware
        run: |
          python -m pip install ninja
          cmake --workflow --preset host-sil
      - name: SIL tests against the library
        if: runner.os != 'Windows'
        run: cargo test -p euc-sim --lib --locked sil::tests -- --include-ignored

  world-golden:
    # The generated world must be bit-identical everywhere: recordings and [world] scenarios keep
    # only the seed, the generator revision and a digest, and rebuild the ground on replay. The
    # test job runs this in debug on all three systems; this job adds optimised builds, which the
    # studio and the CLI use. No MuJoCo: euc-world needs none.
    name: world golden digest (${{ matrix.os }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [dev, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: world-${{ matrix.profile }}
      - run: cargo test -p euc-world --locked --profile ${{ matrix.profile }}

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Licenses, advisories, bans and sources, per deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
