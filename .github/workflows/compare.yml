name: compare

# Our firmware's compat profile must ride every shipped scenario like the stock firmware does:
# `euc sim compare` runs both on the same inputs and fails when a difference exceeds
# scenarios/compare/compat-vs-stock.toml. The stock image is fetched from Begode's update server
# and verified against its pin; it stays in the runner's temp folder and is never cached or
# uploaded.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/**"
      - "firmware/**"
      - "profiles/**"
      - "scenarios/**"
      - "tools/fetch-mujoco/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/compare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compare-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ARM_GNU_TOOLCHAIN_RELEASE: 15.3.rel2
  # sha256 from the release's .sha256asc file for the x86_64 Linux arm-none-eabi archive
  ARM_GNU_TOOLCHAIN_SHA256: 463df9665c246fa13bab2102115bbf83440661b6eb70b44f3dfd4712ca30037a

jobs:
  compat-vs-stock:
    name: compat firmware vs stock
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ninja-build

      - name: Cache Arm GNU Toolchain
        id: toolchain-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/arm-gnu-toolchain
          key: arm-gnu-toolchain-${{ env.ARM_GNU_TOOLCHAIN_RELEASE }}-${{ env.ARM_GNU_TOOLCHAIN_SHA256 }}

      - name: Download Arm GNU Toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          name="arm-gnu-toolchain-${ARM_GNU_TOOLCHAIN_RELEASE}-x86_64-arm-none-eabi.tar.xz"
          base="https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain"
          curl --fail --location --silent --show-error --output "$name" "$base/$ARM_GNU_TOOLCHAIN_RELEASE/$name"
          echo "$ARM_GNU_TOOLCHAIN_SHA256  $name" | sha256sum --check
          mkdir -p ~/arm-gnu-toolchain
          tar -xJf "$name" -C ~/arm-gnu-toolchain --strip-components=1

      - name: Select Arm GNU Toolchain
        run: echo "ARM_GNU_TOOLCHAIN_DIR=$HOME/arm-gnu-toolchain" >> "$GITHUB_ENV"

      - name: Our firmware, compat profile
        working-directory: firmware
        run: cmake --workflow --preset target-compat

      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch MuJoCo
        run: python tools/fetch-mujoco/fetch.py --github

      - name: Keep the stock image in the runner's temp folder
        run: echo "EUC_CACHE_DIR=$RUNNER_TEMP/euc-firmware" >> "$GITHUB_ENV"
      - name: Fetch the stock image (verified against its pin)
        run: cargo run --release --locked -p euc-cli -- fetch begode-extreme

      - name: Build euc with the development CPU backend
        run: cargo build --release --locked -p euc-cli --features unicorn

      - name: Compare on every shipped scenario
        run: |
          mkdir -p compare-results
          status=0
          for scenario in scenarios/*.toml; do
            name=$(basename "$scenario" .toml)
            echo "::group::$name"
            ./target/release/euc sim compare --scenario "$scenario" --a stock --b compat \
              --tolerance scenarios/compare/compat-vs-stock.toml --out "compare-results/$name.json" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Upload the comparisons
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compare-compat-vs-stock
          path: compare-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove the image
        if: always()
        run: rm -rf "$EUC_CACHE_DIR"
