# Firmware CI: format, quirk doc, host tests (ASan + UBSan), SIL library, both target images with their size
# check, and cppcheck with the MISRA addon. Tool versions are pinned to what local builds use.
name: ci-firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/ci-firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/ci-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-firmware-${{ github.ref }}
  cancel-in-progress: true

env:
  ARM_GNU_TOOLCHAIN_RELEASE: 15.3.rel2
  # sha256 from the release's .sha256asc file for the x86_64 Linux arm-none-eabi archive
  ARM_GNU_TOOLCHAIN_SHA256: 463df9665c246fa13bab2102115bbf83440661b6eb70b44f3dfd4712ca30037a
  CLANG_FORMAT_VERSION: 23.1.3

jobs:
  firmware:
    name: Build, test and analyse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: firmware
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ninja, clang-format and cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ninja-build
          pipx install "clang-format==${CLANG_FORMAT_VERSION}"
          # Homebrew carries the same cppcheck release (with its MISRA addon) that local macOS builds use.
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install cppcheck
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          clang-format --version | grep -F "version ${CLANG_FORMAT_VERSION}"
          cppcheck --version
          cmake --version | head -n 1

      - name: Cache Arm GNU Toolchain
        id: toolchain-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/arm-gnu-toolchain
          key: arm-gnu-toolchain-${{ env.ARM_GNU_TOOLCHAIN_RELEASE }}-${{ env.ARM_GNU_TOOLCHAIN_SHA256 }}

      - name: Download Arm GNU Toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          name="arm-gnu-toolchain-${ARM_GNU_TOOLCHAIN_RELEASE}-x86_64-arm-none-eabi.tar.xz"
          base="https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain"
          curl --fail --location --silent --show-error --output "$name" "$base/$ARM_GNU_TOOLCHAIN_RELEASE/$name"
          echo "$ARM_GNU_TOOLCHAIN_SHA256  $name" | sha256sum --check
          mkdir -p ~/arm-gnu-toolchain
          tar -xJf "$name" -C ~/arm-gnu-toolchain --strip-components=1

      - name: Select Arm GNU Toolchain
        run: |
          echo "ARM_GNU_TOOLCHAIN_DIR=$HOME/arm-gnu-toolchain" >> "$GITHUB_ENV"
          "$HOME/arm-gnu-toolchain/bin/arm-none-eabi-gcc" --version | head -n 1

      - name: Quirk table is up to date
        run: python3 tools/gen_quirks_doc.py --check

      - name: Host unit tests (AddressSanitizer + UndefinedBehaviorSanitizer)
        run: cmake --workflow --preset host-debug

      - name: Format check
        run: cmake --build --preset host-debug --target format-check

      - name: Host SIL library and tests
        run: cmake --workflow --preset host-sil

      - name: Target image, compat profile (size budget checked)
        run: cmake --workflow --preset target-compat

      - name: Target image, clean profile (size budget checked)
        run: cmake --workflow --preset target-clean

      - name: cppcheck with the MISRA C:2012 addon
        run: |
          cmake --build --preset host-debug --target cppcheck
          cmake --build --preset target-compat --target cppcheck
          cmake --build --preset target-clean --target cppcheck

      - name: Upload images and size reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-images
          path: |
            firmware/build/target-*/euc-fw-*.elf
            firmware/build/target-*/euc-fw-*.bin
            firmware/build/target-*/euc-fw-*.map
            firmware/build/target-*/size-report.json
          if-no-files-found: warn
