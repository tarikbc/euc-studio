[package]
name = "euc-armv7m"
description = "Our own Cortex-M3 (ARMv7-M Thumb-2) interpreter: the CPU backend EUC Studio ships"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Unicorn as the test oracle for differential fuzzing and stock-image lock-step. GPL-2.0: only the
# tests and benches below use it, the library never does, and no shipped build enables it.
unicorn = ["dep:euc-unicorn"]

[dependencies]
euc-core.workspace = true
euc-unicorn = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
euc-fwsource.workspace = true
euc-profile.workspace = true
euc-sim.workspace = true
toml.workspace = true

[[test]]
name = "fuzz_unicorn"
required-features = ["unicorn"]

[[test]]
name = "lockstep"
required-features = ["unicorn"]

[[bench]]
name = "mips"
harness = false

[lints]
workspace = true
