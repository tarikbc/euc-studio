[package]
name = "euc-cli"
description = "The `euc` command: fetch, import and validate firmware for EUC Studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "euc"
path = "src/main.rs"

[features]
# The Unicorn CPU backend (`--cpu unicorn`). GPL-2.0: development builds only, never shipped.
# Without it `euc sim` runs on our own core (`--cpu own`, the default).
unicorn = ["euc-sim/unicorn"]

[dependencies]
anstream.workspace = true
anstyle.workspace = true
anyhow.workspace = true
clap.workspace = true
euc-ble-radio = { workspace = true, features = ["radio"] }
euc-fwsource.workspace = true
euc-image.workspace = true
euc-physics.workspace = true
euc-profile.workspace = true
euc-proto-begode = { workspace = true, features = ["ble"] }
euc-sim.workspace = true
euc-telemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
