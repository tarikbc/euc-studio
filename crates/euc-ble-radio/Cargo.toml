[package]
name = "euc-ble-radio"
description = "A wheel's BLE link on a real radio: brand-neutral GATT profiles, module models, capture replay, a CoreBluetooth peripheral"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["radio"]
# The CoreBluetooth peripheral (macOS). Protocol crates build without it: they only implement
# `Protocol` and `Responder`, and need no Bluetooth.
radio = ["dep:dispatch2", "dep:objc2", "dep:objc2-core-bluetooth", "dep:objc2-foundation"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
objc2-core-bluetooth = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }

[lints]
workspace = true
