# KingSong wheels: the BLE module, an HM-10 style transparent UART bridge on FFE0/FFE1.
# Radio only: there is no simulated KingSong wheel, so `euc replay --wheel kingsong` (or a capture
# with the header `# wheel: kingsong`) serves KingSong captures, and `euc sim serve` does not apply
# (docs/ble-radio.md, "Brand radios"). Facts: the EUC Remote project's clean-room fact sheet for the
# family, 2026-10-23 (service, characteristic, write type and name rule all "confirmed" there).

schema = 1

# No protocol crate yet: the replay sends the capture's notifications but answers no writes.
protocol = "kingsong"

[advertising]
# With FFE0/FFE1 present, apps accept manufacturer data, an FFF0 service, or a name whose lower-case
# form starts with "ks" (and refuse a name that starts with "NO"); this one is never a real wheel.
name = "KS-EMU"
name_pattern = "KS*"
services = ["FFE0"]
manufacturer = ""

[[service]]
uuid = "FFE0"

# One characteristic both ways: notifications out, writes (without response) in.
[[service.characteristic]]
uuid = "FFE1"
properties = ["notify", "write", "write-without-response"]
roles = ["tx", "rx"]

[module]
kind = "uart-bridge"
# 20-byte notifications, the size of a KingSong message. The idle and pacing values are the Begode
# module's (ESTIMATE); only `euc sim serve` uses them, never a replay.
chunk = 20
idle_ms = 1
interval_ms = 0
