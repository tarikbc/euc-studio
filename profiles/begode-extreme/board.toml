[[instance]]
name = "PWR"
kind = "stm32f1.pwr"
base = 0x4000_7000

[[instance]]
name = "IWDG"
kind = "stm32f1.iwdg"
base = 0x4000_3000

[[instance]]
name = "WWDG"
kind = "stm32f1.plain"
base = 0x4000_2C00

[[instance]]
name = "CRC"
kind = "stm32f1.plain"
base = 0x4002_3000

[[instance]]
name = "DAC"
kind = "stm32f1.plain"
base = 0x4000_7400

[[instance]]
name = "DWT"
kind = "cortex-m3.dwt"
base = 0xE000_1000
size = 0x1000

[[instance]]
name = "imu"
kind = "mpu6500"

[[instance]]
