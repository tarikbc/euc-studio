kind = "buzzer"

# DMA requests: which controller channel serves each peripheral request line.
[[dma]]
request = "ADC1.regular"
channel = "DMA1.1"

[[dma]]
request = "ADC3.regular"
channel = "DMA2.5"

[[dma]]
request = "USART1.rx"
channel = "DMA1.5"

[[dma]]
request = "USART1.tx"
channel = "DMA1.4"

[[dma]]
request = "USART2.rx"
channel = "DMA1.6"

[[dma]]
request = "USART2.tx"
channel = "DMA1.7"

[[dma]]
request = "USART3.rx"
channel = "DMA1.3"

[[dma]]
request = "USART3.tx"
channel = "DMA1.2"

[[dma]]
request = "UART4.rx"
channel = "DMA2.3"

[[dma]]
request = "UART4.tx"
channel = "DMA2.5"

# Wires between components. `board` is the simulator's own board logic: the BLE host, the
# power latch and the plant-driven inputs.
[[wire]]
from = "ADC1.dual_inj"
to = "ADC2.dual_inj"

[[wire]]
from = "ADC1.dual_reg"
to = "ADC2.dual_reg"

[[wire]]
from = "USART1.tx"
to = "board.ble_rx"

[[wire]]
from = "board.ble_tx"
to = "USART1.rx"

[[wire]]
from = "USART3.tx"
to = "bms.rx"

[[wire]]
from = "bms.tx"
to = "USART3.rx"

[[wire]]
from = "SPI3.mosi"
to = "imu.spi"

[[wire]]
from = "imu.spi"
to = "SPI3.miso"

[[wire]]
from = "GPIOA.15"
to = "imu.cs"

[[wire]]
from = "GPIOC.4"
to = "display.din"

[[wire]]
from = "GPIOC.5"
to = "display.clk"

[[wire]]
from = "TIM4.oc4"
to = "buzzer.pwm"

[[wire]]
from = "GPIOB.14"
to = "board.latch"

[[wire]]
from = "board.hall_a"
to = "GPIOB.7"

[[wire]]
from = "board.hall_b"
to = "GPIOB.6"

[[wire]]
from = "board.hall_c"
to = "GPIOB.8"

[[wire]]
from = "board.button"
to = "GPIOB.15"

# What each ADC channel measures. Channels not listed read mid-scale (2048).
[[analog]]
adc = 1
channel = 0
signal = "battery_v"
# Counts per volt, the inverse of the firmware's V*100 = raw*100*0x561>>15.
scale = [32768, 1377]

[[analog]]
adc = 1
channel = 11
signal = "board_temp_c"
# 47 k NTC (B 4150) to ground, 10 k pull-up to 3.3 V; constants from the firmware's conversion.
ntc = { r25 = 47000.0, beta = 4150.0, pullup = 10000.0 }

[[analog]]
adc = 2
channel = 10
# INFERRED: the second NTC is the motor's. Changing it changed no frame field in 3 s.
signal = "motor_temp_c"
ntc = { r25 = 47000.0, beta = 4150.0, pullup = 10000.0 }

[board]
# The power button is low when pressed; the rider releases it 0.1 s after the firmware sets the
# power latch, as on a real power-on.
button_active_low = true
release_after_latch_s = 0.1
