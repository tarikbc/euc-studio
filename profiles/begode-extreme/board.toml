base = 0x4001_3800
clock = "RCC"
bus = "apb2"
irq = { irq = 37 }

[[instance]]
name = "USART2"
kind = "stm32f1.usart"
base = 0x4000_4400
clock = "RCC"
bus = "apb1"
irq = { irq = 38 }

[[instance]]
name = "USART3"
kind = "stm32f1.usart"
base = 0x4000_4800
clock = "RCC"
bus = "apb1"
irq = { irq = 39 }

[[instance]]
name = "UART4"
kind = "stm32f1.usart"
base = 0x4000_4C00
clock = "RCC"
bus = "apb1"
irq = { irq = 52 }

[[instance]]
name = "UART5"
kind = "stm32f1.usart"
base = 0x4000_5000
clock = "RCC"
bus = "apb1"
irq = { irq = 53 }

[[instance]]
name = "SPI1"
kind = "stm32f1.spi"
base = 0x4001_3000

[[instance]]
name = "SPI2"
kind = "stm32f1.spi"
base = 0x4000_3800

[[instance]]
name = "SPI3"
kind = "stm32f1.spi"
base = 0x4000_3C00

[[instance]]
name = "RTC"
kind = "stm32f1.rtc"
base = 0x4000_2800
clock = "RCC"
irq = { irq = 3 }

[[instance]]
name = "BKP"
kind = "stm32f1.bkp"
