# Begode Extreme: body geometry measured on a 3D scan of a real wheel (GOM structured-light
# scanner, 1.6 M triangles, mm units; scan by Tarik Caramanico). The raw scan stays private; the
# cleaned render model is in app/public/models/begode-extreme/. docs/hardware/geometry.md
# explains every method.
#
# Frame (the same as the MJCF in crates/euc-physics): x forward, y left, z up, metres, origin on
# the axle centre in the wheel's mid-plane. "Forward" is the headlight and handle end; the shock
# is at the rear. The shell is upright: z is the normal of the shell's flat bottom face.
#
# Evidence tags:
#   MEASURED  = fitted or read on the scan (accuracy given where it matters)
#   INFERRED  = derived from measurements plus one stated assumption
#   ESTIMATE  = the part is not in the scan; a reasoned guess
#   DEFAULT   = kept from plant.toml / the MJCF until someone measures it

schema = 1

[frame]
origin = "axle centre, wheel mid-plane"
axes = "x forward, y left, z up"
# The axle in the shell's frame. The scanned wheel sits 0.13 deg yawed and 0.25 deg rolled
# against the shell (bearing and slider play); the frame keeps the shell square. MEASURED
axle_axis = [0.0023, 1.0, 0.0044]

[tire]
size = "3.00-12"               # MEASURED: moulded on the sidewall (12 in rim, 3.00 in section)
code = "J802-02"               # the owner's photo confirms the size and shows this tread code
tread = "knobby off-road, staggered rectangular knobs, 15 repeats of 24 deg"  # MEASURED (scan)
outer_diameter_m = 0.4593      # MEASURED: knob tips, unloaded, +-1 mm (tips 0.2290-0.2304 by angle)
radius_free_m = 0.2296         # MEASURED: half the above = axle height when unloaded
tread_base_radius_m = 0.2250   # MEASURED: between the knobs, +-0.5 mm
width_m = 0.0814               # MEASURED: widest sidewall section (at radius 0.19 m), +-0.5 mm
crown_radius_m = 0.058         # MEASURED: lateral curvature of the tread envelope, +-3 mm
# Loaded rolling radius 0.2251 m = 4.5 mm under the free knob radius (load and knob squash). The
# firmware counts 0.0505 m per electrical turn; the owner's ride log (2026-10-17) has GPS at 0.905
# of the displayed speed, so with this tire the motor has 31 pole pairs and the display reads
# 1.107 x the true speed (docs/models/electrical.md). ESTIMATE (radius), INFERRED (pole pairs)
rolling_radius_m = 0.2251
pole_pairs = 31                # INFERRED from the owner's ride log, as plant.toml

[rim]
bead_diameter_m = 0.3048       # MEASURED: the sidewall ends at radius 0.150-0.152 m (12 in nominal)
flange_diameter_m = 0.320      # MEASURED: +-3 mm
flange_spacing_m = 0.0614      # MEASURED: inner faces of the two flanges

[hub]
width_m = 0.0805               # MEASURED: outer faces of the motor side covers

[ground]
# The scan stops 89 mm above the floor, so the contact patch is not in it. MEASURED (free radius)
axle_height_m = 0.2296
axle_height_loaded_m = 0.2251  # INFERRED: equals the firmware's rolling radius

[pedals]
# CNC aluminium decks: full width over the middle, rounded ends, hexagonal cut-outs, a plain centre
# strip, a bright machined edge, steel grip pins. The decks were off the wheel for the scan: only the
# hinge brackets and pins are in it. Shape and sizes from the owner's tape photo (2026-10-16) and a
# retailer's parts diagram (not in the repo); docs/hardware/geometry.md "Pedals". The [collision]
# deck boxes keep the earlier 290 x 135 mm until a physics change takes these.
in_scan = false
pivot_axis = "x"               # MEASURED: a 6 mm pin, fore-aft
pivot_y_m = 0.1148             # MEASURED: +-y, pin to pin 0.2296 m
pivot_z_m = 0.0075             # MEASURED: above the axle
bracket_min_m = [-0.0221, 0.1043, -0.0312]  # MEASURED: left bracket (mirror for the right)
bracket_max_m = [0.0235, 0.1351, 0.0101]
length_m = 0.300               # MEASURED +-0.010 (owner's tape, end to end)
width_m = 0.138                # INFERRED +-0.007 (parts diagram's ratio; hinge edge to outer edge)
thickness_m = 0.009            # ESTIMATE +-0.002, plate centred on the pin
inner_edge_y_m = 0.1088        # ESTIMATE: hinge edge 6 mm inside the pin
outer_edge_y_m = 0.2471        # INFERRED +-0.007
notch_m = [0.050, 0.0212]      # INFERRED: hinge notch length, depth past the pin (clears the scanned bracket; the diagram's is 0.045-0.056 long)
cells = { flats_m = 0.0385, corner_r_m = 0.005, pitch_across_m = 0.0461, column_x_m = [0.0516, 0.0901, 0.1286], rim_m = 0.0075 }  # INFERRED (diagram lattice, tape photo's soft corners)
centre_strip_m = 0.062         # INFERRED: plain strip in the middle (the maker's lettering on the real deck)
hinge_rod = { diameter_m = 0.006, length_m = 0.190 }  # diameter MEASURED (scan pin); length ESTIMATE 0.125-0.200
deck_top_z_m = 0.012           # ESTIMATE +-0.005 (grip pins add 3 mm)
surface_height_m = 0.2416      # ESTIMATE: deck top above the ground, unloaded
fold = "about the pin (x); the left deck folds up with +90 deg about x, the right with -90 deg"

[shell]
# Four battery packs, two on each side of the tire, split fore and aft by the slider channel
# where the axle block rides up and down on the suspension. All MEASURED (face fits, +-0.5 mm).
pack_x_m = [-0.1243, 0.1243]
pack_outer_y_m = [-0.1023, 0.1013]
pack_inner_y_m = [-0.0458, 0.0443]   # 3.5-5 mm from the tire sidewall
pack_top_z_m = 0.3703
pack_bottom_z_m = -0.0298            # at the fore and aft ends
pack_lip_z_m = -0.0415               # bottom lip between the ends
lowest_z_m = -0.0518                 # axle block under the channel
channel_half_width_m = 0.0293
length_m = 0.2485
width_m = 0.2035                     # packs; 0.2702 over the pedal brackets
# Whole wheel: shock at the rear to tread at the front, top of the handle above the ground.
overall_length_m = 0.4794
overall_width_m = 0.2702
overall_height_m = 0.7149
body_min_m = [-0.2497, -0.1352, -0.0519]
body_max_m = [0.1876, 0.1352, 0.4853]

[seat]
top_z_m = 0.4695               # MEASURED: on the centre line; 0.699 m above the ground
x_m = [-0.1647, 0.1113]        # MEASURED: seat cover
y_m = [-0.0931, 0.0914]

[handle]
# Front carry handle: a 20 mm tube along y between two side plates. MEASURED (circle fit 0.02 mm)
# The plates are orange CNC parts of the rear handle's family (the owner): the parts diagram's front
# handle part, placed by five features of the owner's mounted side photo (back-projected with its
# solved camera) and its crossbar hole on the tube: residuals 0.9-2.8 mm. Per side an L-shaped plate:
# a lower body at the front, a foot to the rear bolted to the frame top by 2 x 2 socket-head screws,
# an arm rising from the body and leaning back to the tube. Three pocketed windows (3 mm deep) with
# see-through centres (a rounded triangle and a long slot in the arm, a slot in the body), a small
# slot and a hole in the body. The tube is black.
arm_faces_y_m = [0.0595, 0.0675]       # MEASURED (scan): inner and outer face, +-y
arm_foot_outer_y_m = 0.074             # MEASURED (scan): the foot stands out further
arm_bounds_xz_m = [[0.114, 0.186], [0.367, 0.483]]  # MEASURED (diagram on the photo); the scan's plate outline agrees within 3 mm
foot_bolts_xz_m = [[0.1263, 0.3768], [0.1385, 0.3767], [0.1261, 0.3866], [0.1385, 0.3872]]  # MEASURED (scan: the socket heads' tops, both sides, +-0.0005); the diagram on the photo agrees within 0.0025
foot_screw_head = { diameter_m = 0.010, height_m = 0.0065 }  # MEASURED (scan): tops 0.0062-0.0077 above the foot
body_bolt_xz_m = [0.1689, 0.3811]      # MEASURED (diagram on the photo) +-0.003
tube_centre_m = [0.1323, 0.0, 0.4738]
tube_radius_m = 0.0100
tube_half_length_m = 0.069
top_z_m = 0.4838

[display]
# Flat smoked window on top, in front of the seat and behind the handle, facing up. The window
# is MEASURED; the board's place under it is INFERRED (centred, +-10 mm), its orientation comes
# from display.toml [mount] (top of the digits to the front, read upright by the rider).
board = "T16-007"
window_z_m = 0.4383
window_tilt_deg = 0.15
window_x_m = [0.041, 0.1265]
window_y_m = [-0.0543, 0.0521]
led_panel_centre_m = [0.0833, -0.0011, 0.4383]
normal = [0.0, 0.0, 1.0]
board_x_axis = [0.0, -1.0, 0.0]   # board "right" = rider's right
board_y_axis = [-1.0, 0.0, 0.0]   # board "down" (drawing y) = rearward

[lights]
# Headlight: four round lenses in one bar under the handle, facing forward. MEASURED
headlight_face_x_m = 0.1751
headlight_lens_diameter_m = 0.022
headlight_lenses_m = [
    [0.1751, -0.0457, 0.3905], [0.1751, -0.0157, 0.3905],
    [0.1751, 0.0143, 0.3905], [0.1751, 0.0443, 0.3905],
]
headlight_bar_min_m = [0.157, -0.057, 0.374]
headlight_bar_max_m = [0.1751, 0.057, 0.407]
tail_light = "the tail light roller: see [roller] here and profiles/begode-extreme/lights.toml"

[roller]
# The round tube across the rear end of the seat, along y. Owner (confirmed): it holds the
# controller's Bluetooth data board (blue status LED at the top centre), the RGB tail-light LED
# rings (the two translucent halves glow orange-red around a black centre band), and a speaker in
# each end cap, driven by a separate Bluetooth audio device. lights.toml has the LEDs.
centre_m = [-0.1868, 0.0, 0.4491]    # MEASURED (circle fit 0.67 mm)
radius_m = 0.0261                    # MEASURED
min_m = [-0.2143, -0.0592, 0.4216]   # MEASURED, with the mounting arms
max_m = [-0.1593, 0.0585, 0.4766]
center_band_half_m = 0.0078          # ESTIMATE (owner video, lights.toml); no seam in the scan
sleeve_y_m = [0.0078, 0.0375]        # +-y: translucent halves, from the band to the end collars
# End caps (speakers): a collar r 0.0275-0.028 from |y| 0.0375 to 0.046, then a recessed end face
# at |y| 0.0505 with an annular grille (r 0.012-0.022, radial windows). MEASURED
speaker_caps_m = [[-0.1868, 0.0505, 0.4491], [-0.1868, -0.0505, 0.4491]]  # normals +y and -y
speaker_grille_m = [0.012, 0.022]    # inner and outer radius
ble_led_m = [-0.1868, -0.008, 0.4754]  # ESTIMATE (owner video): top of the band, right edge

[suspension]
# The axle sits in a carriage on each side that slides on a vertical rod inside the channel
# between the fore and aft packs. All positions MEASURED on the scan (unloaded wheel); which part
# moves is INFERRED from the layout.
rod_diameter_m = 0.0300                 # MEASURED: cylinder fit, spread 0.1 mm
rod_axis_xy_m = [[-0.0002, 0.0636], [-0.0002, -0.0649]]   # left, right; MEASURED
rod_tilt_deg = 0.13                     # MEASURED: top tilted rearward; vertical within 0.15 deg
carriage_top_z_m = 0.2510               # MEASURED: up-facing face of the carriage block
rod_stop_z_m = 0.3595                   # MEASURED: lower face of the ring on the rod: a pipe O-ring
                                        # (parts diagram), a travel indicator, not a stop (INFERRED);
                                        # the frame's top plate underside at 0.383 is the hard limit
free_rod_above_carriage_m = 0.1085      # to the ring; 0.132 to the top plate
frame_bottom_mount_z_m = [-0.052, -0.020]  # MEASURED: block around the rod below the axle (INFERRED frame)
state_in_scan = "topped out (INFERRED: unloaded wheel, carriage at the bottom of the rods)"
moving = "INFERRED: rods and pedal brackets on the frame (sprung); carriage, axle, motor, tire and the shock's bottom eye (on the carriage) unsprung"
# The scan shows an OLDER linkage (owner, 2026-10-20): a shock from a rear tray up to a top cross
# shaft, plates between. Kept for the record only (MEASURED, 20 mm cross shafts, plate_upper
# +-0.003); the owner's 2026-10-22 photos show none of these parts any more.
scan_linkage_pivots_xz_m = { shock_top = [-0.1395, 0.3675], shock_bottom = [-0.2265, 0.1835], plate_upper = [-0.132, 0.333] }
# Current linkage (owner photos 2026-10-22 with the pad cover and the seat off; positions from
# camera poses solved on scan points; docs/hardware/geometry.md "Rear linkage"), per side: the
# shock runs forward and down from its top eye on the rocker, under the rear roller, to its bottom
# eye on the carriage; a link joins the rocker pin to a second carriage pin above that eye; the
# rocker turns about a frame pivot. Positions at full extension, x and z in metres:
#   shock_top     MEASURED (photo pose, +-3 mm)
#   rocker_pin    MEASURED (photo pose, +-3 mm)
#   spare_hole    MEASURED (photo pose): an empty hole beside the top eye, a second shock position
#   shock_bottom  INFERRED: 200 mm from the top eye along the photographed shock line (42-52 deg
#                 forward of vertical), +-10 mm; hidden behind the rear packs in every photo
#   link_bottom   INFERRED: the link's lower pin, +-8 mm. In the cover-off side photo (pose on 11
#                 scan points) the link's edges, back-projected on its plane, run 16 +-2 deg below
#                 horizontal from the rocker pin; the parts map's link is 156 mm hole to hole at the
#                 rocker plate's scale. It cannot be the shock's bottom shaft (that needs 25 deg).
#                 It must ride on the carriage, or the rocker could not turn
#   frame_pivot   MEASURED (parts-map fit, +-3 mm): the rocker plate's fourth hole. A retailer's
#                 parts map (not in the repo) shows the plate with four holes; a similarity fit of
#                 three of them to shock_top, rocker_pin and spare_hole (scale error 2 %, residuals
#                 under 0.8 mm) places the fourth here. It is the steel pin between two frame blocks
#                 seen with the seat off (x +-0.020, z +-0.015 there), so that pin is the pivot.
linkage_pivots_xz_m = { frame_pivot = [-0.0666, 0.3981], rocker_pin = [-0.1770, 0.3130], shock_top = [-0.1850, 0.3780], shock_bottom = [-0.0338, 0.2471], link_bottom = [-0.0270, 0.2700] }
spare_hole_xz_m = [-0.1725, 0.3930]
rocker_plates_y_m = [0.0465, 0.0510]    # ESTIMATE: |y| of each rocker plate; the rear photo's camera pose fits 0.050-0.054 for the outer face
link_plates_y_m = [0.0405, 0.0450]      # ESTIMATE: inboard of the rocker plates
link_length_m = 0.1560                  # MEASURED (parts map at the rocker plate's scale, +-2 %): rocker_pin to link_bottom
rocker_sides_m = { pivot_to_pin = 0.1394, pivot_to_eye = 0.1201, eye_to_pin = 0.0655 }  # MEASURED (photo poses and the parts-map fit)
rocker_turn_deg = 4.3                   # INFERRED: largest turn over the physics travel (drawn linkage); it turns back once the link passes horizontal (about 50 mm)

[shock]
# Current shock: DNM coil-over without reservoir. Owner photos 2026-10-16: body and threaded collar
# at the bottom eye, shaft and red rebound knob at the top eye. Both eyes move: the bottom eye with
# the carriage, the top eye with the rocker ([suspension] linkage_pivots_xz_m). Positions at full
# extension (owner photos 2026-10-22).
eye_top_m = [-0.1850, 0.0, 0.3780]      # MEASURED (photo pose): on the rocker, under the rear roller
eye_bottom_m = [-0.0338, 0.0, 0.2471]   # INFERRED: 200 mm along the photographed shock line, on the carriage
eye_to_eye_m = 0.200                    # MEASURED (owner); the scan's (older) shafts are 0.2035 apart
stroke_m = 0.055                        # ESTIMATE: 200 mm DNM coil-overs come with 50-57 mm (plant.toml)
body_at = "bottom eye"                  # owner photos: shaft and knob at the top eye
spring_outer_diameter_m = 0.056         # DNM size chart
spring_length_m = 0.115                 # DNM size chart for 200 mm
spring_wire_m = 0.008                   # ESTIMATE
spring_coils = 7                        # owner photos
spring_rate_n_per_m = 131_300           # 750 lb/in, MEASURED (owner; printed on the spring)
eyelet_bore_m = 0.008                   # DNM listing
eyelet_width_m = 0.024                  # DNM listing
motion_ratio = "Two readings (docs/hardware/suspension-linkage.md): rocker turning, 2.3 at rest falling to 1.7 at 93.5 mm (band 1.9-2.7 at rest); rocker fixed, constant 1.5 (1.3-1.7). The physics keeps plant.toml's constant 1.7 until a seat-press video decides"

[rear_handle]
# Orange anodised CNC U-handle (owner photos 2026-10-16 and 2026-10-22): two flat arms bolted to the
# frame and through the roller axis, a black anodised round grip bar parallel to the roller, behind
# it. Socket-head cap screws at the roller axis and the grip.
arm_frame_bolt_m = [-0.115, 0.4150]     # x, z; MEASURED (scan, the lower part of the arm)
arm_roller_bolt_m = [-0.1868, 0.4491]   # x, z; MEASURED (the roller axis)
arm_outer_y_m = 0.0587                  # MEASURED: outer face, +-y
arm_thickness_m = 0.006                 # ESTIMATE
arm_width_m = 0.030                     # MEASURED (scan, lower part)
# MEASURED on the owner's cover-off photo (camera pose solved from 11 scan points, 8 px RMS; edges
# traced and back-projected onto the arm's outer face, +-2 mm): the arm's lower part ends in a foot
# at x -0.113 (z 0.387-0.411) and carries three windows; the upper part runs nearly level along its
# top (z 0.480-0.485) to the grip and down in a dog-leg to the roller, with a dog-leg blind pocket.
# The two upper windows are pocketed rims (3 mm deep, two steps) around smaller see-through
# openings; the one by the foot is a pocketed slot.
arm_foot_x_m = -0.113
arm_windows_xz_m = [[-0.1683, 0.4382], [-0.1426, 0.4155], [-0.1240, 0.4005]]  # centres, MEASURED
arm_top_edge_xz_m = [[-0.2004, 0.4795], [-0.2245, 0.4828], [-0.2462, 0.4845]]  # MEASURED (photo)
arm_end_radius_m = 0.0095               # MEASURED (photo): around the grip bolt
grip_centre_m = [-0.2447, 0.0, 0.4735]  # MEASURED (photo pose): the grip bolt's socket on its head plane, 62.8 mm past the roller axis
grip_diameter_m = 0.020                 # MEASURED (photo) +-0.003
screw_head = { diameter_m = 0.010, top_y_m = 0.0625 }  # MEASURED (scan at the roller screw): 3.8 mm proud of the arm, hex socket
evidence = "lower arms and screw heads MEASURED (scan); outline, windows, pocket and grip MEASURED (photo pose); thickness ESTIMATE"

[imu]
# The controller board is inside the body and not visible in the scan. DEFAULT (findings)
above_axle_m = 0.15

# Collision shapes proposed for the MJCF, in the frame above (sent to eng). Boxes: centre and
# half sizes; capsules: end points and radius.
[collision]
# Tire as a torus: tube 0.058 at 0.1716 from the axle matches the knob tips and the crown within
# 1.5 mm up to +-37 mm off the centre plane (about 40 deg of lean). In MuJoCo: one convex mesh of
# the tube's outer half (crates/euc-physics/src/mjcf.rs), or the sdf torus plugin.
tire_torus = { major_m = 0.1716, minor_m = 0.058 }
# Same outer diameter, true width, sharper crown (if the side reach matters more than the crown).
tire_torus_width = { major_m = 0.1889, minor_m = 0.0407 }
pack_left = { centre = [0.0, 0.0734, 0.1644], half = [0.1243, 0.0284, 0.2059] }
pack_right = { centre = [0.0, -0.0734, 0.1644], half = [0.1243, 0.0284, 0.2059] }
top = { centre = [-0.0267, -0.0009, 0.4199], half = [0.1380, 0.0923, 0.0496] }
front = { centre = [0.1495, 0.0, 0.4250], half = [0.0382, 0.0750, 0.0590] }
roller = { from = [-0.1868, -0.059, 0.4491], to = [-0.1868, 0.059, 0.4491], radius = 0.0275 }
# Shock: a static capsule on the scan's (older) shock line, spring radius. The current shock runs
# from (-0.185, 0.378) forward and down to (-0.034, 0.247) ([shock]); this solid moves to it when the
# physics takes the photo-measured linkage (a physics change, not made yet).
shock = { from = [-0.1395, 0.0, 0.3675], to = [-0.2265, 0.0, 0.1835], radius = 0.028 }
# ESTIMATE: rear handle grip bar. The photo puts the grip at (-0.2447, 0.4735) ([rear_handle]);
# this solid keeps the earlier estimate until a physics change moves it.
rear_handle_grip = { from = [-0.2515, -0.0527, 0.5042], to = [-0.2515, 0.0527, 0.5042], radius = 0.013 }
pedal_bracket_left = { centre = [0.0007, 0.1197, -0.0106], half = [0.0228, 0.0154, 0.0207] }
pedal_bracket_right = { centre = [0.0007, -0.1197, -0.0106], half = [0.0228, 0.0154, 0.0207] }
# ESTIMATE: deployed pedal decks (see [pedals]), centred on the pins, top at deck_top_z_m.
pedal_left = { centre = [0.0, 0.1763, 0.0075], half = [0.145, 0.0675, 0.0045] }
pedal_right = { centre = [0.0, -0.1763, 0.0075], half = [0.145, 0.0675, 0.0045] }

# Side pad covers: C-shaped moulded covers of textured black plastic, not in the scan. Shape INFERRED
# from a two-view reconstruction of the owner's photos of a removed cover (5.5 / 3.1 px RMS); size
# and place MEASURED from the owner's side photo with the cover mounted (camera 6.9 px RMS on scan
# points, the cover's points 4.5 px RMS); docs/hardware/geometry.md "Pad covers". Left cover;
# mirror y (and 1.0 mm further out) for the right. Drawing only: no collision solid, no mass.
[pad_covers]
in_scan = false
length_m = 0.366               # MEASURED (mounted photo) +-0.008
height_m = 0.299               # MEASURED (mounted photo) +-0.006
depth_m = 0.060                # INFERRED (+-20 %): the packs' outer face to the end block's top
heights_m = { upper_arm = 0.016, lower_arm = 0.018, spine = [0.025, 0.035], slotted_block = [0.045, 0.047], lettering_block = [0.049, 0.052], round_block = 0.052, end_block = 0.060 }  # INFERRED, out from the packs' outer face
wall_m = 0.0035                # ESTIMATE: open-backed moulded walls
x_range_m = [-0.182, 0.184]    # MEASURED (mounted photo) +-0.006
z_range_m = [0.055, 0.354]     # MEASURED (mounted photo) +-0.006: the top 16 mm below the packs' top
pitch_deg = 2.6                # MEASURED (mounted photo): nose up
inner_y_m = 0.1012             # flush on the left packs' outer face (scan 0.10105); the right cover on the right packs' (0.10205), 1.0 mm further out
wrap_y_m = 0.066               # INFERRED: past the packs' front and rear ends the cover wraps their end faces in to here (the arms' undersides on the low photo of the removed cover)
outer_y_m = 0.1615             # the end block; arms at about 0.117-0.120
contact_gap_m = { outline_median = 0.0002, outline_p95 = 0.0017, wrap_median = 0.0006, overlap_max = 0.0001 }  # MEASURED on the exported model against the packs
screws_m = [[-0.104, 0.123, 0.311], [-0.103, 0.122, 0.125], [0.108, 0.126, 0.122]]  # MEASURED (mounted photo; depth INFERRED): the three visible screw heads (upper arm, lower arm, slotted block)
# Where the rider's legs can rest (a later leg-pad contact model): outer faces (INFERRED depth)
contact_faces = [
  { name = "lettering_block_top", x_m = [0.059, 0.114], z_m = [0.252, 0.324], y_m = 0.1506 },
