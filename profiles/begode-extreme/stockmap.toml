# Named places in the stock Begode Extreme firmware (build GW1825007, pinned in wheel.toml).
# Our names; addresses only, never code or bytes. Read by crates/euc-sim for boot markers and
# reports. Evidence: the M1 emulation notes (all OBSERVED in the emulator unless marked).

schema = 1
build = "GW1825007"

# Entry points. `marker = true`: the run report records the first time execution reaches it
# (boot milestones; watching stops after the marker window).
[[entry]]
name = "reset_handler"
addr = 0x0800_322C
marker = true

[[entry]]
name = "c_runtime_init"
addr = 0x0800_3130
marker = true

[[entry]]
name = "main"
addr = 0x0800_AA7C
marker = true

[[entry]]
name = "imu_init"
addr = 0x0800_6390
marker = true

[[entry]]
name = "boot_button_and_hall_wait"
addr = 0x0800_982C
marker = true

[[entry]]
name = "bms_uart_init"
addr = 0x0800_B234
marker = true

[[entry]]
name = "bms_poll_and_parse"
addr = 0x0800_B318
marker = true

[[entry]]
name = "telemetry_tick"
addr = 0x0800_8038
marker = true

[[entry]]
name = "frame_tx_pump"
addr = 0x0800_70E4
marker = true

[[entry]]
name = "imu_calibrate"
addr = 0x0800_49B8
marker = true

[[entry]]
name = "motor_control_isr_body"
addr = 0x0800_4668
marker = true

[[entry]]
name = "rtc_tick_control"   # INFERRED name
addr = 0x0800_678C
marker = true

[[entry]]
name = "ble_command_parser"
addr = 0x0800_5988
marker = true

# RAM variables (after the firmware's own scatter-load).
[[ram]]
name = "version_string"
addr = 0x2000_0084
size = 9
kind = "ascii"
note = "the text the `V` command sends"

[[ram]]
name = "telemetry_pause"
addr = 0x2000_0048
size = 1
kind = "u8"
note = "set to 3 by every received command byte: telemetry pauses for 3 rounds"

[[ram]]
name = "alerts"
addr = 0x2000_005A
size = 1
kind = "u8"
note = "frame 04 byte 14; bit 2 = IMU fault, bit 6 = hall error"

[[ram]]
name = "speed_cms"
addr = 0x2000_0120
size = 2
kind = "s16"
note = "the speed the balance law schedules its gains with, cm/s, forward positive, from hall edges per 20 ms (balance findings §4)"

[[ram]]
name = "vq_active"
addr = 0x2000_037A
size = 2
kind = "s16"
note = "the q voltage the FOC applies (Q15 of Vbus/√3; 0 while braking at a standstill); |Vq| / 315 is the app's PWM % (motor findings §6)"

[[ram]]
name = "pwm_alarm"
addr = 0x2000_0265
size = 1
kind = "u8"
note = "PWM alarm flag: set while the PWM is above the alarm threshold (`W P`, 80 % by default); drives alert bit 0 and, with `e`, the PWM tiltback"

[[ram]]
name = "tiltback_speed_deg"
addr = 0x2000_022C
size = 4
kind = "f32"
note = "speed tiltback offset added to the balance error, degrees (balance findings §5.1)"

[[ram]]
name = "tiltback_battery_deg"
addr = 0x2000_0248
size = 4
kind = "f32"
note = "battery voltage and temperature tiltback offset, degrees (balance findings §5.1)"

[[ram]]
name = "tiltback_pwm_deg"
addr = 0x2000_024C
size = 4
kind = "f32"
note = "PWM tiltback offset, degrees; only with `e` (balance findings §5.1)"

[[ram]]
name = "attitude_pitch_deg"
addr = 0x2000_0204
size = 4
kind = "f32"
note = "the firmware's own pitch estimate (Mahony filter), degrees, positive nose down (balance findings §3)"

[[ram]]
name = "drive_command"
addr = 0x2000_0394
size = 4
kind = "f32"
note = "balance command to the FOC, ±1050: 20 Q15 Iq counts per unit in current mode, 30 Q15 Vq counts in voltage mode (motor findings §6)"

# Cutoff flags (balance findings §5.3 and §6): scenarios fail if one is set after the stand lets go.
[[ram]]
name = "balance_disabled"
addr = 0x2000_00DA
size = 1
kind = "u8"
note = "1 while the balance output is disabled (fall detectors, handle cut, lock); the output ramps to 0"
role = "cutoff"

[[ram]]
name = "drive_fault"
addr = 0x2000_03D0
size = 1
kind = "u8"
note = "hard fault: TIM8 main output off, the motor free-wheels until a power cycle"
role = "cutoff"

[[ram]]
name = "hall_fault"
addr = 0x2000_0398
size = 1
kind = "u8"
note = "hall fault latched: TIM8 main output off until a power cycle"
role = "cutoff"
