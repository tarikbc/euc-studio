# Begode Extreme: electrical plant (motor, inverter, halls, analog front end, battery, heat).
# Read by crates/euc-plant. docs/models/electrical.md explains every value. Values marked
# DEFAULT are reasoned estimates, not measurements of a real wheel: replace them when measured.
# Values marked FIRMWARE follow from the stock firmware's own constants and conventions.

schema = 1
grid_us = 5.0                 # integration step
seed = 1                      # sensor and hall noise

[motor]
pole_pairs = 31               # INFERRED: owner's ride log 2026-10-17: GPS / displayed speed 0.905 over 54 steady rows; with the tire's 0.2251 m the firmware's 0.0505 m per electrical turn shows 1.107 x the true speed (electrical.md)
resistance_ohm = 0.080        # DEFAULT: phase resistance of a 134 V hub motor
ld_h = 0.000200               # DEFAULT: surface magnets, Ld = Lq
lq_h = 0.000200               # DEFAULT
flux_wb = 0.0180              # INFERRED: owner's ride log 2026-10-17: steady-state firmware PWM against speed, within 5 % at 40-74 km/h displayed
direction = -1                # FIRMWARE: rolling forward lowers the electrical angle (negative hall count)
angle_offset_deg = 0.0

[inverter]
dead_time_s = 0.0000005       # DEFAULT: gate driver; the timer adds only 14 ns (10 kHz) or 403 ns (12 kHz)
switch_resistance_ohm = 0.002 # DEFAULT: parallel MOSFETs per switch position
diode_drop_v = 0.7            # DEFAULT: body diode
switching_time_s = 0.0000001  # DEFAULT: rise + fall

[halls]
offset_deg = -90.0            # FIRMWARE: the firmware's angle is the rotor flux angle minus 90 deg el.,
                              # so a positive firmware Iq makes forward torque
noise_deg = 0.0

[sensors]
# FIRMWARE scales: Q15 32768 = 437.5 A, 16 counts per ADC LSB -> 0.2136 A per count.
phase_current = [
    { phase = "a", adc = 1, channel = 4, amps_per_count = -0.213623046875 },  # PA4, inverted
    { phase = "b", adc = 2, channel = 5, amps_per_count = 0.213623046875 },   # PA5
]
bus_current = { adc = 2, channel = 10, amps_per_count = 0.213623046875 }    # PC0, + = discharge (sign DEFAULT)
bus_voltage = { adc = 1, channel = 0, volts_per_count = 0.042022705078125 } # PA0, FIRMWARE 1377/32768 V per count
board_ntc = { adc = 1, channel = 11, r25_ohm = 47000.0, beta_k = 4150.0, pullup_ohm = 10000.0 }  # PC1
noise_counts = 0.0

[battery]
packs = 2                     # two packs in parallel, each read by two 16-cell BMS boards
series = 32
capacity_ah = 10.0            # DEFAULT: 32S2P of 5 Ah cells per pack, 2 x 1.2 kWh = the published 2400 Wh
r0_ohm = 0.007                # DEFAULT: per 2P cell group (about 14 mOhm per cell)
r1_ohm = 0.003                # DEFAULT
tau_s = 30.0                  # DEFAULT
soc = 0.883                   # 129.7 V at rest, as in the 2026-10-15 capture of the maintainer's wheel
temp_sensors = 6              # 3 per BMS board
heat_capacity_j_per_k = 6000.0  # DEFAULT
cooling_w_per_k = 3.0         # DEFAULT
ocv = [                       # DEFAULT: typical high-power NMC 21700 cell
    [0.00, 3.00], [0.05, 3.30], [0.10, 3.42], [0.20, 3.52], [0.30, 3.60], [0.40, 3.66],
    [0.50, 3.72], [0.60, 3.80], [0.70, 3.88], [0.80, 3.97], [0.90, 4.07], [1.00, 4.20],
]

[thermal]
ambient_c = 25.0
stage = { heat_capacity_j_per_k = 400.0, resistance_k_per_w = 0.5 }    # DEFAULT
motor = { heat_capacity_j_per_k = 3000.0, resistance_k_per_w = 0.3 }   # DEFAULT

# Mechanics: tire, spinning wheel, shell and rear suspension. Read by crates/euc-physics (through
# euc-sim); docs/models/body.md explains every value. DEFAULT and ESTIMATE values are estimates,
# not measurements; MEASURED ones come from the 3D scan (geometry.toml, docs/hardware/geometry.md).
# The collision shapes (tire torus, shell solids) come from geometry.toml [collision]. Heights are
# from the axle at full extension (as scanned), positive up.
[body.tire]
radius_m = 0.2251             # ESTIMATE: loaded rolling radius, 4.5 mm under the MEASURED free radius 0.2296 m (load and knob squash; the owner puts about 5 mm of the sag in the tire)
half_width_m = 0.0407         # MEASURED: 3.00-12 tire, 81.4 mm wide
friction = 1.1                # ESTIMATE: owner's report, dry asphalt about 1.0-1.2
crr = 0.014                   # INFERRED: owner's ride log 2026-10-17 (light rider), fit with a constant power term, +-0.01
contact_time_s = 0.022        # INFERRED: 25 psi (owner's report), about 125 kN/m: 9.5 mm under the loaded wheel

[body.wheel]
mass_kg = 16.0                # DEFAULT: rotor, magnets, rim and tire (the stator rides on the suspension carriage)
spin_inertia_kgm2 = 0.487     # DEFAULT: 0.6 m r^2, most of the mass near the rim

[body.shell]
# The sprung part: frame, packs, controller, pedals. With the carriage's 6 kg and the wheel's 16 kg
# the wheel weighs 42 kg (DEFAULT). The centre of mass and inertia are those of a 26 kg shell with
# the stator (6 kg on the axle) taken out: com 0.10 -> 0.13 m, inertia minus the stator's own
# (a 0.08 m disc) and its offset.
mass_kg = 20.0                # DEFAULT
com_above_axle_m = 0.13       # DEFAULT: battery packs reach above the axle
inertia_kgm2 = [0.76, 0.82, 0.45]  # DEFAULT: roll, pitch, yaw (from a 0.35 x 0.30 x 0.55 m box)
pedal_below_axle_m = -0.012   # MEASURED (approx.): deck tops 12 mm above the axle; scan pins +7.5 mm + half a 9 mm deck; the owner's ~240 mm floor-to-deck (unloaded, 2026-10-16) minus the 229.6 mm free radius gives ~10 mm
imu_above_axle_m = 0.15       # DEFAULT: controller board above the axle, on the frame (sprung)

[body.suspension]
# Rear coil-over shock on a rocker linkage (per side: carriage -> link -> triangular rocker ->
# shock, owner photo 2026-10-16); the motor's axle slides up into the frame on two vertical 30 mm
# rods (geometry.toml [suspension]). The shock is a DNM coil-over, 200 mm eye to eye, 750 lb/in
# (owner). The rocker's leverage changes along the travel: model maps it from the scan and the
# owner's photos into `ratio_curve`; until then one constant ESTIMATE. With the default 80 kg rider
# the sag is 18 mm (19 % of the 93.5 mm axle travel); the sprung mass bounces at about 3.4 Hz with
# a damping ratio of about 0.18.
unsprung_mass_kg = 6.0        # ESTIMATE: stator, axle clamps and slider blocks (the wheel's 16 kg also moves)
axis_forward_deg = -0.13      # MEASURED (scan): the rods lean 0.13 deg with the top to the rear
spring_rate_n_per_mm = 131.3  # MEASURED: "DNM - 750 LBS/IN" printed on the owner's spring
preload_mm = 2.0              # ESTIMATE
stroke_mm = 55.0              # ESTIMATE: 200 mm DNM coil-overs come with 50-57 mm of stroke
eye_to_eye_mm = 200.0         # MEASURED (owner); the scan's older shock was 204 mm
# The owner's sag (about 20 mm at the pedals with the rider on, about 5 mm of it the tire) implies a
# ratio of about 1.7 (1.6-1.9 with 0-2 mm preload). The stroke times the ratio stays within the
# 108 mm the rods leave above the carriage. Replace it with the rocker curve when it is mapped.
linkage_ratio = 1.7           # ESTIMATE from the owner's sag: axle travel per mm of shock travel (used while ratio_curve is empty)
ratio_curve = []              # [[axle travel mm, ratio], ...] from full extension; waits for model's rocker curve
damping_n_s_per_m = 2200.0    # ESTIMATE: at the shock, compression and rebound alike
