# The rider stands on the wheel for a minute: the firmware must hold it up, near level, without
# cutting the motor, through a few gentle pushes. The stand holds the wheel while the firmware
# boots and lets go once it balances.
schema = 1
name = "balance-60s"
description = "Rider stands still for 60 s and takes three gentle pushes; the wheel stays up and level."
wheel = "begode-extreme"
seconds = 63.0
release_s = 2.5
speed_kmh = [[0, 0]]
# [start s, N forward, duration s]: a hand on the back, then on the chest, then a firmer one.
push = [[10, 40, 0.5], [25, -40, 0.5], [40, 80, 0.3]]

# Pedal trim to neutral (W U 4) before the release: a blank settings record starts at trim 0, which
# tilts the pedals 4.8° nose down. One byte at a time, as an app sends them.
[[inject]]
at_s = 1.0
bytes = "W"

[[inject]]
at_s = 1.3
bytes = "U"

[[inject]]
at_s = 1.6
bytes = "4"

[[expect]]
check = "upright"

[[expect]]
check = "no_cutoff"

[[expect]]
check = "pitch"
max_abs_deg = 10.0

[[expect]]
check = "stopped_at_end"
max_abs_kmh = 1.0
