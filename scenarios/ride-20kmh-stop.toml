# The rider leans forward to 20 km/h, rides there for 10 s, then leans back and brakes to a stop.
# The firmware must carry the rider through it without a cutoff and keep the pedals near level.
schema = 1
name = "ride-20kmh-stop"
description = "Lean to 20 km/h, hold it for 10 s, brake to a stop."
wheel = "begode-extreme"
seconds = 40.0
release_s = 2.5
# [s, km/h]: stand still, about 1.1 m/s² up to 20 km/h, hold, about 1.4 m/s² down to a stop.
speed_kmh = [[0, 0], [6, 0], [11, 20], [21, 20], [25, 0]]
# Factory settings with level pedals (a blank journal would tilt them 4.8° nose down).
settings = "neutral"

[[expect]]
check = "upright"

[[expect]]
check = "no_cutoff"

[[expect]]
check = "pitch"
max_abs_deg = 10.0

[[expect]]
check = "speed_reached"
kmh = 19.0

[[expect]]
check = "stopped_at_end"
max_abs_kmh = 1.0
