# PRELIMINARY: the rear suspension is modelled (measured spring; stroke and linkage ratio are
# estimates), but the rider has no knees and the tire is a soft contact. Do not tune this run to pass.
#
# A pothole at 20 km/h: 2 cm deep, 50 cm long, with steep edges, on the maintainer's settings.
# The wheel drops in and hits the far edge; the impact takes about a tenth of the wheel's speed, the
# suspension compresses about 35 of its 66 mm, the shell dips about 8° nose down, and the firmware
# answers with near-full forward current. The shell turns at about 250 °/s, inside the stock gyro's
# ±500 °/s, so the firmware's attitude follows the truth. Deeper holes (3 and 5 cm) turn it faster
# than the gyro's range: docs/models/scenarios.md and docs/findings/stock-firmware.md (finding 7).
#
# The outcome is decided by the mechanics within 0.1 s, faster than the firmware's balance loop can
# change much, and it depends on the body model. The `record` checks always pass; `upright` and
# `no_cutoff` are the safety verdict.
schema = 1
name = "pothole-20kmh"
description = "Hit a 2 cm deep pothole at 20 km/h: the impact, the firmware's answer, and whether the wheel stays up."
wheel = "begode-extreme"
seconds = 23.0
release_s = 2.5
speed_kmh = [[0, 0], [6, 0], [11, 20]]
settings = "tarik-2026-10-15"
# Rider: the default rider (it eases off when the pedals tip back).

[terrain]
length_m = 120.0

[[terrain.feature]]
kind = "pothole"
at_m = 50.0
depth_m = 0.02
length_m = 0.5

[[expect]]
check = "record"
signal = "distance_m"
stat = "first_above"
threshold = 50.0

[[expect]]
check = "record"
signal = "speed_kmh"
stat = "min"
from_s = 15.0
by_s = 19.9

[[expect]]
check = "record"
signal = "pitch_deg"
stat = "min"
from_s = 15.0

[[expect]]
check = "record"
signal = "torque_nm"
stat = "max"
from_s = 15.0

[[expect]]
check = "record"
signal = "iq_a"
stat = "max"
from_s = 15.0

# After the dip the shell rides nose down while the firmware believes it is level: the pitch rate
# passed the IMU's ±500 °/s range, so the gyro clipped and the attitude estimate lost the excess.
# Its error, firmware estimate against the true pitch, is recorded here (the bound only records).
[[expect]]
check = "firmware_tracks"
var = "attitude_pitch_deg"
scale = -1.0          # the firmware's pitch is positive nose down
signal = "pitch_deg"
max_rms = 45.0
from_s = 20.8
by_s = 22.0

[[expect]]
check = "upright"

[[expect]]
check = "no_cutoff"

[[expect]]
check = "record"
signal = "suspension_mm"     # travel used: 66 mm is the bottom-out
stat = "max"
from_s = 15.0
