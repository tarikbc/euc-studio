# How far our firmware's compat profile may stray from the stock firmware on the shipped scenarios
# (`euc sim compare --a stock --b compat --tolerance ...`; CI: .github/workflows/compare.yml).
# docs/compare.md describes the format.
#
# The two firmwares run different code, so their interrupts take different numbers of cycles and
# the plant is sampled a few cycles apart: the rides are close but not identical. The limits below
# are about 1.5 to 2 times the largest differences measured on 2026-10-16 on the plain rides
# (balance-60s, ride-20kmh-stop: speed 0.31 km/h, wheel 0.84 rad/s, pitch 0.90°, torque RMS
# 3.2 N·m, Iq RMS 3.7 A): tight enough that a real behaviour change shows, loose enough for that
# timing noise. These measurements identify earlier builds, not the current acceptance baseline.
# Tables marked KNOWN DIFFERENCE limit the judged interval around a real compat difference.
# until_s excludes later samples; same_checks = false also skips equality of scenario verdicts.
# A passing comparison with either exception does not establish complete-ride equivalence.
# Remove an exception only after the complete ride matches on the current model.
#
# Since W2 (2026-10-23) the scenarios ride the city world. Its height field is not mirror-symmetric
# as the flat floor's plane is, so every ride gets a small roll (the plane kept it at 1e-17), and
# firmware timing differences part it: roll_deg is 2 times the largest difference measured in the
# city over all 20 scenarios at quanta 4000, 3000 and 2000 (0.1235° in overlean-no-pwm-tiltback at
# 17.75 s, quantum 4000; next 0.081, 0.073, 0.073, then under 0.04). It stays bounded: balance-60s
# differs by 0.00004° in its first tenth, 0.008° at most in its middle and 0.0002° in its last.
# Every other limit is the flat floor's: the city moved none of them past it.

# Every check both runs judge must give the same verdict.
same_checks = true

# Our firmware's optional IMU frame (type 20, preset target-compat-imu) is left out on both sides; stock and the
# plain compat image never send it, so the shipped comparisons do not change.
ignore_frame_types = [0x20]

[channels]            # largest |stock - compat|, in the channel's unit
speed_kmh = 0.5
wheel_rad_s = 1.5     # the wheel's speed relative to the shell also carries the pitch rate
pitch_deg = 1.5
roll_deg = 0.25      # city height field gives a small roll; firmware timing differences part it (0.1235° measured)
distance_m = 0.1
battery_v = 0.5
soc_pct = 0.01
board_temp_c = 0.5
motor_temp_c = 0.5

# RMS of stock - compat, for currents and torque (their transients are sharp). The phase currents
# are not judged: they alternate hundreds of times a second at speed, so a few cycles of timing
# make large instantaneous differences; Iq and torque carry what matters.
[channels_rms]
torque_nm = 5.0
iq_a = 6.0
battery_a = 1.0      # climbs and top speed draw 30-60 A

[scenario.balance-60s]
note = "Firmware hunting, sustained by the rider (PRELIMINARY): at standstill the firmware does not compensate the inverter dead time, so small commands give almost no torque and the pedals hunt after each push (pitch swinging about ±0.4°, a cycle of about 3 s). The default articulated rider's ankle damping (2026-10-22) keeps the hunting going where the rigid rider settles (docs/findings/stock-firmware.md, finding 11). A few cycles of timing part the runs more: they differ by 0.58 km/h at 42.96 s, just after the third push (rigid rider: 0.06 km/h). Both firmwares hold the wheel alike: pitch within 0.69° and torque RMS 1.8 N·m."
[scenario.balance-60s.channels]
speed_kmh = 0.9       # 0.585 km/h measured at 42.96 s with the articulated rider; 0.056 with the rigid one (2026-10-22)

[scenario.hard-braking-30kmh]
note = "Regeneration lifts the pack to about 131 V when the rider brakes, and the peak differs more (0.42 V measured). Rider model, not firmware: the default articulated rider (2026-10-22) stops sooner (below 1 km/h at 20.0 s, rigid 20.8 s) and then sways at rest, and the runs differ by 0.55 km/h at 21.41 s, the last second, where the rigid rider's differ by 0.26 km/h at most. Both firmwares brake alike until then (battery 0.29 V apart at most)."
[scenario.hard-braking-30kmh.channels]
battery_v = 1.0
speed_kmh = 0.85      # 0.545 km/h measured at 21.41 s with the articulated rider; 0.26 with the rigid one (2026-10-22)

[scenario.low-battery-tiltback]
note = "Both firmwares start the battery tiltback on the same tick (1.73 s) with the same step and ramp it in the direction of their own speed sign; on the stand the 10 ms samples differ by one step only because compat writes it about 0.5 ms later in each tick. After the release the rider stands and rocks near zero speed and eases off 1.5 km/h per degree of tiltback beyond 2°, so each small difference in the ride flips the speed sign, and with it the ramp direction, on other ticks: the ramps drift up to 0.8° apart by 12 s and become speed, pitch and current differences. Unjudged, city vs flat (W2): the firmwares' battery tiltbacks drift up to 1.22° apart (0.38° on the flat floor) and their drive commands up to 102 counts (66); the judged channels stay within the limits below (pitch 1.79°, Iq RMS 5.9 A)."
[scenario.low-battery-tiltback.channels]
speed_kmh = 2.5       # 2.15 km/h measured (CPI 2.0, LTO build)
wheel_rad_s = 3.5     # 3.1 rad/s measured
pitch_deg = 3.0       # 2.5° measured
battery_v = 1.0
distance_m = 0.6      # 0.52 m measured
[scenario.low-battery-tiltback.channels_rms]
iq_a = 10.0          # 9.2 A measured
torque_nm = 8.5      # 8.0 N·m measured

[scenario.hall-loss-while-riding]
note = "KNOWN DIFFERENCE (timing-sensitive): on a total hall loss at 15 s the two firmwares drive the motor differently at once (Iq up to 365 A apart at 15.04 s), and compat's cut has not always come within 0.2 s as stock's does. Judged until the fault."
until_s = 15.0
same_checks = false

[scenario.hall-single-line-loss]
note = "KNOWN DIFFERENCE: after one hall line drops at 15 s, compat drives the motor differently (Iq up to 61 A apart, battery up to 2.2 V); the scenario's checks still agree. Judged until the fault."
until_s = 15.0

[scenario.overlean-top-speed]
note = "The rider accelerates towards the motor's limit; near it the two firmwares' currents part ways (battery from about 17.3 s). Judged until then."
until_s = 16.5

[scenario.overlean-top-speed-30pct]
note = "As overlean-top-speed at 30 % charge."
until_s = 16.5

[scenario.overlean-no-pwm-tiltback]
note = "As overlean-top-speed-30pct with the PWM tiltback off: near the limit the two firmwares' currents part ways (battery 0.5 V apart by 19.3 s). Judged until 18 s; both runs must still cut and fall (same_checks). The clean profile differs on purpose here (PWM_TILTBACK_VQ_ONLY: its headroom tiltback starts at about 19.9 s and the rider stays up); this file judges compat only."
until_s = 18.0

[scenario.hill-climb-low-battery]
note = "The low pack sags under climb current. Earlier builds showed battery-tiltback, pitch, and distance differences. The existing limits retain that allowance. Since 2026-10-22 the scenario rides the default articulated rider. Rider model, not firmware: at the end the rider who never gives up stalls on the 20 % grade with the battery tiltback near 26°, and the articulated rider's sway there parts the runs by 0.52 km/h and 6.65° of pitch at 34.5 s (rigid rider: 0.28 km/h and 2.12°). See the current acceptance report for measured results."
[scenario.hill-climb-low-battery.channels]
battery_v = 1.5       # 0.81 V measured
pitch_deg = 10.0      # 6.65° measured at 34.50 s with the articulated rider; 2.12° with the rigid one (2026-10-22)
distance_m = 1.0      # 0.66 m measured (2026-10-20); 0.32 m with the articulated rider, 0.42 m with the rigid one (2026-10-22)
speed_kmh = 0.8       # 0.52 km/h measured at 34.60 s with the articulated rider; 0.28 with the rigid one (2026-10-22)
[scenario.hill-climb-low-battery.channels_rms]
battery_a = 2.0

[scenario.ride-20kmh-stop]
note = "Earlier builds differed by up to 0.51 km/h as the wheel rocked near rest. The existing allowance remains. Since 2026-10-22 the scenario rides the default articulated rider: 0.39 km/h measured (rigid rider: 0.29 km/h)."
[scenario.ride-20kmh-stop.channels]
speed_kmh = 0.8       # 0.51 km/h measured (2026-10-20)

[scenario.downhill-cruise-2pct]
note = "Unjudged, city vs flat (W2): on the city's 2 % incline the firmwares' drive commands differ by up to 146 counts (71 on the flat floor's slope strip); every judged channel stays within the global limits."

[scenario.coasting-stop]
note = "A 38 s run: the rider coasts to a stop and then creeps backwards, so a small speed difference adds up to distance at the end (0.101 m in CI against the 0.1 m default; speed within 0.25 km/h throughout)."
[scenario.coasting-stop.channels]
distance_m = 0.3      # 0.101 m measured

[scenario.pothole-20kmh]
note = "Timing-sensitive: the impact at the far edge decides the outcome within 0.1 s, so a few cycles of timing part the runs from there; in one build compat's firmware also cut the drive at 19.9 s while stock's did not. Judged until the impact: in the city (since W2) the wheel drops into the 0.49 m hole at 19.34 s, meets the far edge at 19.37 s and the current rises from 19.40 s, so the window ends at 19.36 s (19.5 s on the flat floor)."
until_s = 19.36
same_checks = false

[scenario.pothole-5cm-20kmh]
note = "As pothole-20kmh with a 5 cm hole, judged until the impact; both ride through on a clipped gyro, and the checks still compare. In the city (since W2) the hole's near edge lies at 49.70 m: the wheel drops in at 19.32 s and meets the far edge at 19.40 s, where the currents and the pack voltage part (stock and compat 2.46 V apart at 19.41 s, quantum 4000). The window ends at 19.39 s, before the far edge. On the flat floor the impact started at 19.46 s and the window ended at 19.45 s."
until_s = 19.39

[scenario.rider-steps-off-15kmh]
note = "After the step-off at 15 s the riderless wheel tips over on its own, and a few cycles of timing change how it rolls (roll up to 15° apart). Judged until the step-off. BORDERLINE in the city (W2): how the fall ends is chaotic, so the end-speed check flips between the firmwares per quantum (stock fails it at 4000 and 2000 with 3.35 km/h after the wheel crawls on its nose, compat at 2000 with 5.70 km/h; they disagree at 4000); the cut and roll checks agree. Equality of check verdicts is skipped."
until_s = 15.0
same_checks = false

[scenario.rider-steps-off-5kmh]
note = "As rider-steps-off-15kmh, stepping off at 12 s."
until_s = 12.0

[scenario.ble-service-cut-standing]
note = "The service sequence cuts the motor at 10.31 s on both and the standing wheel and rider fall over (11.52 s); a few cycles of timing change how they fall (roll up to 3° apart). Judged until the cut; the checks still compare."
until_s = 10.3

[scenario.full-effort-70kmh-stop-soc100]
note = "KNOWN DIFFERENCE (borderline, platform-sensitive), 2026-10-22: the two firmwares launch alike to 35 km/h (launch phase ends at 9.49 s), then the lean step into the build phase and the approach to voltage saturation part their currents (battery 1.2 V apart at 9.51 s). On macOS arm64 both complete all five gates at quanta 4000, 3000 and 2000, yet the braking from 20.9 s already puts them 3.9 km/h and 26 degrees of pitch apart. On the Linux x86-64 CI runner (default quantum) stock completes and compat cuts while braking at 21.51 s. The verdict depends on floating-point and timing detail, so equality of check verdicts is skipped and only samples through 9.0 s are judged. A pass here does not establish complete-ride equivalence. See docs/models/full-effort-acceptance.md."
until_s = 9.0
same_checks = false

[scenario.full-effort-70kmh-stop-soc50]
note = "KNOWN DIFFERENCE, 2026-10-21: at 50% charge, stock cuts before 70 km/h at quanta 4000 and 2000. At quantum 3000 it reaches 70 km/h, then cuts while braking. Compat reaches 70 km/h and cuts while braking at all three quanta. All complete scenarios fail. Only samples through 9.0 s are judged, and equality of check verdicts is skipped. On the flat floor that window already exceeded 0.5 V of battery voltage (0.538 V at quantum 3000; 0.416 V at 4000). In the city (since W2) it is 0.628, 0.771 and 0.482 V at quanta 4000, 3000 and 2000: the same known SOC50 regime difference, so the battery limit records it (2 times 0.771 V) rather than hiding a new one. A pass cannot establish complete-ride equivalence. See docs/models/full-effort-acceptance.md."
until_s = 9.0
same_checks = false
[scenario.full-effort-70kmh-stop-soc50.channels]
battery_v = 1.6       # 0.771 V measured in the city at quantum 3000 (2026-10-23)

[scenario.full-effort-70kmh-stop-soc20]
note = "As full-effort-70kmh-stop-soc100 at 20 % charge: the low pack sags more under the launch current (0.68 V apart at 8.9 s); both cut before 70 km/h (checks agree). Judged until the launch phase ends."
until_s = 9.0
[scenario.full-effort-70kmh-stop-soc20.channels]
battery_v = 1.0       # 0.68 V measured (2026-10-20)
